 
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entre Linhas | Contos</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Georgia, serif;
      background: #171513;
      color: #f5eee4;
      line-height: 1.7;
    }

    header {
      text-align: center;
      padding: 70px 20px 45px;
      background: #211c18;
      border-bottom: 1px solid #a98958;
    }

    h1 {
      color: #d8b77a;
      font-size: 42px;
      margin: 0;
      letter-spacing: 3px;
    }

    header p {
      color: #c9bba8;
      font-style: italic;
    }

    main {
      max-width: 760px;
      margin: 55px auto;
      padding: 0 24px;
    }

    h2 {
      color: #d8b77a;
      text-align: center;
      font-weight: normal;
    }

    .conto {
      margin-top: 35px;
      padding: 30px;
      background: #211c18;
      border: 1px solid #493b2b;
      border-radius: 8px;
    }

    .conto p {
      color: #ded4c7;
    }

    footer {
      text-align: center;
      padding: 30px 15px;
      color: #a99b89;
      border-top: 1px solid #493b2b;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <header>
    <h1>Entre Linhas</h1>
    <p>Histórias que continuam dentro de nós.</p>
  </header>

  <main>
    <h2>Nosso cantinho de histórias</h2>

    <section class="conto">
      <h2>Em breve, uma nova história...</h2>
      <p>
        Toda história começa com algumas palavras.
        Talvez a próxima seja justamente aquela que
        você precisava encontrar.
      </p>
    </section>
  </main>

  <footer>
    Entre Linhas · Um universo de contos
  </footer>
</body>
</html>
